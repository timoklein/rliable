[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rliable"
version = "2.0.0"
description = "rliable: Reliable evaluation on reinforcement learning and machine learning benchmarks."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Rishabh Agarwal" },
]
maintainers = [
    { name = "Timo Klein" },
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "seaborn>=0.12",
    "matplotlib>=3.7",
]
classifiers = [
    "Development Status :: 4 - Beta",

    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",

    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["benchmarking", "evaluation", "reproducibility", "research", "reinforcement", "machine", "learning"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/timoklein/rliable"
Documentation = "https://github.com/timoklein/rliable"
"Bug Reports" = "https://github.com/timoklein/rliable/issues"
Source = "https://github.com/timoklein/rliable"

[tool.setuptools.packages.find]
include = ["rliable*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py"]

[tool.ruff]
line-length = 127
indent-width = 2
