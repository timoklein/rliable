name: Test

on:
  push:
  pull_request:

env:
  MPLBACKEND: Agg

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create venv
        run: uv venv
      - name: Install rliable with test extras
        run: uv pip install -e ".[test]"
      - name: Run tests
        run: uv run --no-project python -m pytest -W error::DeprecationWarning -q

  latest-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Create venv
        run: uv venv
      - name: Install rliable with test extras
        run: uv pip install -e ".[test]"
      - name: Upgrade to latest dependencies
        run: uv pip install --upgrade "numpy>=2" "pandas>=3" seaborn matplotlib scipy
      - name: Run tests
        run: uv run --no-project python -m pytest -W error::DeprecationWarning -q
